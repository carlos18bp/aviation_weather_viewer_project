name: CI — Phase 00 baseline

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: aviation_weather_test
          POSTGRES_USER: aviation_weather
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aviation_weather -d aviation_weather_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_ENV: test
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-django-key-with-more-than-fifty-characters-not-a-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: aviation_weather_test
      POSTGRES_USER: aviation_weather
      POSTGRES_PASSWORD: ci-only-not-a-secret
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Update APT indexes
        timeout-minutes: 5
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

      - name: Install GeoDjango system libraries
        timeout-minutes: 10
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y gdal-bin libgdal-dev libgeos-dev postgresql-client

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Enable and verify PostGIS
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT PostGIS_Full_Version();"

      - name: Run Django system check
        run: python manage.py check

      - name: Run directed health tests
        run: pytest weather/tests/test_health.py -v

  frontend-page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Run directed page tests
        run: npm test -- app/__tests__/page.test.tsx

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build frontend
        run: npm run build
